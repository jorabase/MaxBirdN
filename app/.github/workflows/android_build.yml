name: Build Android App

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. v6.1.0)'
        required: true
        default: '6.1.0'
        type: string
      version_code:
        description: 'Version Code (e.g. 60100)'
        required: true
        default: '60100'
        type: number
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build APK with custom versions
      env:
        VERSION_NAME: ${{ github.event.inputs.version_name || '6.0.0' }}
        VERSION_CODE: ${{ github.event.inputs.version_code || '60000' }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      run: |
        echo "Building with Version Name: $VERSION_NAME and Version Code: $VERSION_CODE"
        ./gradlew assembleRelease || gradle assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/*.apk
